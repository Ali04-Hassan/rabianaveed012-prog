name: Generate Snake Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: rabianaveed012
          outputs: |
            dist/github-user-contribution-grid-snake.svg?color_snake=#F43F5E&color_dots=#EBEDF0,#FFE4E6,#FDA4AF,#F43F5E,#BE123C
            dist/github-user-contribution-grid-snake-dark.svg?color_snake=#EC4899&color_dots=#161B22,#831843,#BE185D,#DB2777,#F472B6

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
